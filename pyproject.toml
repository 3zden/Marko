[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markko-viewer"
version = "0.1.0"
description = "Lightweight GFM + Mermaid markdown viewer"
requires-python = ">=3.9"
dependencies = [
    "markdown>=3.6",
    "pymdown-extensions>=10.0",
    "pygments>=2.17",
]

[project.scripts]
markko = "markko_cli:main"

[tool.setuptools]
py-modules = ["markko_cli"]
